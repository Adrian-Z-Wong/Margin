<style>
  @font-face {
    font-family: "Margin Latin";
    src: local("Times New Roman Italic"), local("TimesNewRomanPS-ItalicMT"), local("Times Italic"), local("Times-Italic"), local("Liberation Serif Italic"), local("LiberationSerif-Italic");
    unicode-range: U+0000-00FF, U+0100-02FF, U+1E00-1EFF;
  }
  :root {
    --bg: #fff;
    --fg: #0a0a0a;
    --muted: #666;
    --line: #ebebeb;
    --font: "Margin Latin", "Times New Roman", Times, "FangSong", "STFangsong", "仿宋", "华文仿宋", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0b; --fg: #f2f2f2; --muted: #9a9a9a; --line: #222; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 var(--font);
    -webkit-text-stroke-width: 0.35px;
  }
  main { max-width: 800px; margin: 0 auto; padding: 96px 24px 72px; }
  h1 { font-weight: 400; font-size: 64px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
  .tag { font-size: 22px; margin: 18px 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 48px; }
  .btn {
    display: inline-block;
    padding: 14px 30px;
    border: 1px solid var(--fg);
    background: var(--fg);
    color: var(--bg);
    font-size: 17px;
    text-decoration: none;
    letter-spacing: 0.04em;
  }
  .btn:hover { opacity: .82; }
  .btn.ghost { background: transparent; color: var(--fg); }
  .btn.ghost:hover { background: var(--fg); color: var(--bg); opacity: 1; }
  .note { color: var(--muted); font-size: 15px; margin-top: 16px; }
  ul { list-style: none; padding: 0; margin: 64px 0 0; border-top: 1px solid var(--fg); }
  li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  img { display: block; width: 100%; margin-top: 64px; border: 1px solid var(--line); }
  footer { margin-top: 48px; color: var(--muted); font-size: 15px; }
  footer a { color: inherit; }
  @media (max-width: 640px) {
    main { padding: 56px 16px 48px; }
    h1 { font-size: 48px; }
  }
</style>
